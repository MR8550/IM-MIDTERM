<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IM Question Bank</title>
<style>
:root{--bg:#e9eef9;--tx:#1c1c1e;--mu:#6b7280;--gl:rgba(255,255,255,.62);--gl2:rgba(255,255,255,.8);--ed:rgba(255,255,255,.75);--ln:rgba(60,60,67,.14);--ac:#0a7aff;--ok:#1f9d55;--okb:rgba(52,199,89,.18);--bad:#e5342b;--badb:rgba(255,69,58,.16);--sh:0 8px 30px rgba(30,40,80,.12);--b1:#9ec5ff;--b2:#ffc2dc;--b3:#a8f0e0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d14;--tx:#f2f2f7;--mu:#9ca3af;--gl:rgba(40,42,56,.55);--gl2:rgba(58,60,78,.7);--ed:rgba(255,255,255,.12);--ln:rgba(235,235,245,.14);--ac:#4da3ff;--ok:#4cd98a;--okb:rgba(48,209,88,.2);--bad:#ff6b63;--badb:rgba(255,69,58,.22);--sh:0 8px 30px rgba(0,0,0,.45);--b1:#1d3a78;--b2:#6a1f48;--b3:#0f5a55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d14;--tx:#f2f2f7;--mu:#9ca3af;--gl:rgba(40,42,56,.55);--gl2:rgba(58,60,78,.7);--ed:rgba(255,255,255,.12);--ln:rgba(235,235,245,.14);--ac:#4da3ff;--ok:#4cd98a;--okb:rgba(48,209,88,.2);--bad:#ff6b63;--badb:rgba(255,69,58,.22);--sh:0 8px 30px rgba(0,0,0,.45);--b1:#1d3a78;--b2:#6a1f48;--b3:#0f5a55;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;font:16px/1.55 -apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tx);background:var(--bg) radial-gradient(60% 50% at 8% 0%,var(--b1),transparent 70%),radial-gradient(50% 50% at 100% 10%,var(--b2),transparent 70%),radial-gradient(60% 50% at 70% 100%,var(--b3),transparent 70%);background-attachment:fixed}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:flex;height:100%;gap:14px;padding:14px}
.glass{background:var(--gl);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--ed);box-shadow:var(--sh)}
aside{width:310px;flex:none;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto}
h1{font-size:21px;margin:0;letter-spacing:-.02em}
.sub{color:var(--mu);font-size:13px;margin:-8px 0 0}
.seg{display:flex;background:var(--ln);border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--gl2);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.grp{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--gl2);border-radius:999px;padding:5px 11px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
select{width:100%;padding:9px 10px;border-radius:12px;border:1px solid var(--ln);background:var(--gl2)}
.stat{font-size:13.5px;color:var(--mu)}
.bar{height:6px;border-radius:6px;background:var(--ln);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.grid button{aspect-ratio:1;border-radius:10px;border:1px solid var(--ln);background:var(--gl2);font-size:12.5px;padding:0;position:relative}
.grid button.cur{outline:2px solid var(--ac);outline-offset:1px}
.grid .done{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid .ok{background:var(--okb);border-color:var(--ok)}
.grid .bad{background:var(--badb);border-color:var(--bad)}
.grid .bm::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#ff9f0a}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ln);background:var(--gl2);border-radius:12px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
main{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:2px}
.top{display:none}
.card{border-radius:26px;padding:26px 28px;max-width:860px;width:100%;margin:0 auto}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mu);font-size:13.5px}
.tag{background:var(--ln);border-radius:8px;padding:2px 9px;font-weight:600;color:var(--tx)}
.rep{background:rgba(255,159,10,.2);color:#b86e00;border-radius:8px;padding:2px 9px;font-weight:600}
.bmb{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--mu)}
.bmb.on{color:#ff9f0a}
.q{font-size:19px;line-height:1.5;margin:14px 0 18px;font-weight:550}
.opts{display:grid;gap:9px}
.o{display:flex;gap:12px;text-align:left;width:100%;border:1px solid var(--ln);background:var(--gl2);border-radius:15px;padding:12px 14px;align-items:flex-start}
.o:hover:not(:disabled){border-color:var(--ac)}
.o b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ln);display:grid;place-items:center;font-size:14px}
.o.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.o.sel b{background:var(--ac);color:#fff}
.o.ok{border-color:var(--ok);background:var(--okb)}
.o.ok b{background:var(--ok);color:#fff}
.o.bad{border-color:var(--bad);background:var(--badb)}
.o.bad b{background:var(--bad);color:#fff}
.o:disabled{cursor:default}
.ans{margin-top:16px;padding:14px 16px;border-radius:15px;background:var(--okb);border:1px solid var(--ok)}
.nav{display:flex;gap:10px;margin-top:20px;align-items:center}
.nav .sp{flex:1;text-align:center;color:var(--mu);font-size:13.5px}
.banner{max-width:860px;width:100%;margin:0 auto;border-radius:20px;padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner strong{font-size:22px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.scrim{display:none}
@media (max-width:860px){
.app{padding:10px;gap:10px;flex-direction:column}
aside{position:fixed;z-index:20;left:0;top:0;bottom:0;width:min(88vw,330px);border-radius:0 26px 26px 0;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-105%);transition:transform .25s}
.open aside{transform:none}
.open .scrim{display:block;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.35)}
.top{display:flex;gap:10px;align-items:center}
.card{padding:20px 18px;border-radius:22px}
.q{font-size:17.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="glass" aria-label="Question navigator">
<h1>IM question bank</h1>
<p class="sub">Semester 7, Internal Medicine, 280 past-paper questions</p>
<div class="seg" id="mode"><button data-m="study">Study</button><button data-m="exam">Exam</button></div>
<div class="grp" id="grp"></div>
<select id="topic" aria-label="Topic"></select>
<select id="flag" aria-label="Filter">
<option value="">All questions</option><option value="new">Not answered yet</option><option value="bad">Answered wrong</option><option value="bm">Bookmarked</option><option value="rep">Repeated in another paper</option>
</select>
<div class="stat" id="stat"></div>
<div class="bar"><i id="pb"></i></div>
<div class="grid" id="grid"></div>
<div class="row">
<button class="btn p" id="fin">Finish exam</button>
<button class="btn" id="rst">Reset progress</button>
<button class="btn" id="thm">Light or dark</button>
</div>
</aside>
<div class="scrim" id="scrim"></div>
<main id="main">
<div class="top"><button class="btn" id="menu">Questions</button></div>
<div id="bn"></div>
<div id="qc"></div>
</main>
</div>
<script>
const D=[{"n":1,"g":"Haematology","t":"Anemia","l":"W1 · L1 LECTURE","s":"P1 Final · Q53","r":"","q":"A 65-year-old woman with pernicious anemia and severe vitamin B12 deficiency presents with pallor, glossitis, and mild subicterus. Which laboratory triad characteristically reflects the resulting ineffective erythropoiesis and intramedullary hemolysis?","o":["Low MCV + increase reticulocytes + direct bilirubin","Normal MCV + normal reticulocytes + direct bilirubin","High MCV + decrease reticulocytes + indirect bilirubin","High MCV + marked reticulocytosis + direct bilirubin","Low MCV + decrease reticulocytes + indirect bilirubin"],"a":2,"k":"High MCV + decrease reticulocytes + indirect bilirubin"},{"n":2,"g":"Haematology","t":"Anemia","l":"W1 · L1 LECTURE","s":"P1 Final · Q55","r":"","q":"A 30-year-old female presents with chronic fatigue and restless legs syndrome. CBC confirms microcytic hypochromic anemia (Hb 9.4 g/dL, MCV 69 fL). What is the single most sensitive and specific laboratory investigation to confirm iron deficiency anemia?","o":["Serum iron alone","Total iron binding capacity (TIBC) alone","Serum ferritin","Hemoglobin electrophoresis","Bone marrow biopsy"],"a":2,"k":"Serum ferritin"},{"n":3,"g":"Haematology","t":"Anemia","l":"W1 · L1 LECTURE","s":"Midterm I · Q7","r":"","q":"Patient complains of acute onset of bleeding /gums, fever & easy fatigability. On examination: no splenomegaly or lymphadenopathy. Investigations requested showed: Platelet count 10,000 x 10⁶/L of blood, Hemoglobin 8 and Neutrophil count 100 x 10⁶/L, the most probable diagnosis is:","o":["ITP","Moderate aplastic anemia","CML","Hypersplen ism","Very severe Aplastic anemia"],"a":4,"k":"Very severe Aplastic anemia"},{"n":4,"g":"Haematology","t":"Bleeding disorders","l":"W1 · L2 LECTURE","s":"P1 Final · Q42","r":"","q":"A 26-year-old female presents with sudden spontaneous petechiae and mucosal gum bleeding. Physical examination reveals no hepatosplenomegaly or lymphadenopathy. CBC shows: Platelets 12,000/µL, Hb 13.5 g/dL, WBC 6,800/µL; peripheral blood smear confirms isolated thrombocytopenia. What is the diagnosis?","o":["Thrombotic thrombocytopenic purpura","Immune thrombocytopenia","Severe aplastic anemia","Disseminated intravascular coagulation","Acute myeloid leukemia"],"a":1,"k":"Immune thrombocytopenia"},{"n":5,"g":"Haematology","t":"Bleeding disorders","l":"W1 · L2 LECTURE","s":"P1 Final · Q44","r":"","q":"Which multimeric plasma glycoprotein mediates platelet adhesion to exposed subendothelial collagen via the glycoprotein Ib/IX receptor and also functions as the essential carrier and stabilizer for coagulation Factor VIII?","o":["Fibrinogen","Fibronectin","von Willebrand factor","Thrombopoietin","Antithrombin III"],"a":2,"k":"von Willebrand factor"},{"n":6,"g":"Haematology","t":"Bleeding disorders","l":"W1 · L2 LECTURE","s":"Midterm II · Q12","r":"","q":"Subtype of VWD might be associated with thrombocytopenia is:","o":["VWD Type 3","VWD Type 1","VWD Type 2N","VWD Type 2M","VWD Type 2B"],"a":4,"k":"VWD Type 2B"},{"n":7,"g":"Haematology","t":"Bleeding disorders","l":"W1 · L2 LECTURE","s":"Midterm II · Q13","r":"","q":"DIC is associated with subtype of anemia whose blood film shows:","o":["Spherocytes","Heinz bodies","Schistocytes","Bite cells","Sickle cells"],"a":2,"k":"Schistocytes"},{"n":8,"g":"Haematology","t":"Approach to a case of hemolytic anemia","l":"W1 · TCD1 TCD","s":"P1 Final · Q45","r":"","q":"A fetus is found on third-trimester ultrasound to have generalized subcutaneous edema, pericardial effusion, massive ascites (hydrops fetalis), and profound hepatosplenomegaly. Hemoglobin analysis reveals gamma-globin tetramers (Hb Barts). What is the diagnosis?","o":["Beta thalassemia major","Sickle cell anemia","Alpha thalassemia major","Hereditary spherocytosis","Paroxysmal nocturnal hemoglobinuria"],"a":2,"k":"Alpha thalassemia major"},{"n":9,"g":"Haematology","t":"Approach to a case of hemolytic anemia","l":"W1 · TCD1 TCD","s":" dterm II · Q14","r":"","q":"19 year old patient presenting with pallor, jaundice, splenomegaly & bronzed skin. CBC shows microcytic hypochromic anemia, the most probable diagnosis is:","o":["Sickle cell anemia","Thalassemia","Hereditary spherocytosis","G6PD","Iron deficiency anemia"],"a":1,"k":"Thalassemia"},{"n":14,"g":"Haematology","t":"Approach to a case of hemolytic anemia","l":"W1 · TCD1 TCD","s":"Midterm II · Q16","r":"","q":"One of the diagnostic studies of PNH is:","o":["Schilling test","Hemoglobin electrophoresis","Serum immunofixation","Flow cytometry for CD15, CD30","Flow cytometry for CD55, CD59"],"a":4,"k":"Flow cytometry for CD55, CD59"},{"n":15,"g":"Haematology","t":"Acute leukemia","l":"W1 · L3 LECTURE","s":"P1 Final · Q51","r":"","q":"A 42-year-old male presents with acute bleeding diathesis, fatigue, and prominent, boggy, bleedprone swollen gums (gingival hyperplasia). Which French-American-British (FAB) subtypes of Acute Myeloid Leukemia characteristically exhibit this monocytic tissue infiltration?","o":["AML (M0 + M1)","AML (M2 + M3)","AML (M4 + M5)","AML (M6 + M7)","AML with t(8;21)"],"a":2,"k":"AML (M4 + M5)"},{"n":16,"g":"Haematology","t":"Acute leukemia","l":"W1 · L3 LECTURE","s":"Midterm I · Q8","r":"","q":"A hematological emergency characterized by hypoxia, retinal hemorrhage, tinnitus, headache and confusion in cases of AML is:","o":["Leucostasis","Richter transformation","CNS infiltration","Febrile neutropenia","Tumor lysis syndrome"],"a":0,"k":"Leucostasis"},{"n":17,"g":"Haematology","t":"Myeloproliferative neoplasms","l":"W1 · TUT1 TUTORIAL","s":"P1 Final · Q50","r":"","q":"A 58-year-old male with Primary Myelofibrosis presents with early satiety and left hypochondrial fullness. On physical examination, a firm, non-tender abdominal mass with a distinct notch is palpated extending 10 cm below the left costal margin. What is this physical finding?","o":["Hepatomegaly","Splenomegaly","Left renal enlargement","Retroperitoneal sarcoma","Distended urinary bladder"],"a":1,"k":"Splenomegaly"},{"n":18,"g":"Haematology","t":"Myeloproliferative neoplasms","l":"W1 · TUT1 TUTORIAL","s":"P1 Final · Q59","r":"","q":"A 64-year-old male with JAK2 V617F-positive Polycythemia Vera and a prior history of ischemic stroke requires cytoreductive therapy in addition to therapeutic phlebotomy. What is the preferred firstline oral cytoreductive agent?","o":["Aspirin monotherapy","Hydroxyurea","Anagrelide","Busulfan","Interferon-alpha monotherapy"],"a":1,"k":"Hydroxyurea"},{"n":19,"g":"Haematology","t":"Data interpretation (benign hematologic disorders)","l":"W1 · SK1 SKILLS","s":"P1 Final · Q22","r":"","q":"In clinical internal medicine and hematology, severe neutropenia—which significantly predisposes patients to life-threatening bacterial and fungal sepsis—is defined as an Absolute Neutrophil Count (ANC) below how many cells/µL?","o":["1500","1000","500","200","100"],"a":2,"k":"500"},{"n":20,"g":"Haematology","t":"Chronic leukemia","l":"W2 · L4 LECTURE","s":"P1 Final · Q46","r":"","q":"A 66-year-old male with persistent absolute lymphocytosis undergoes peripheral blood flow cytometry for suspected Chronic Lymphocytic Leukemia (CLL). Which immunophenotypic co-expression profile characteristically confirms the diagnosis and distinguishes it from Mantle cell lymphoma?","o":["Positive CD5 - Negative CD23","Negative CD5 - Positive CD23","Positive CD5 - Positive CD23","Positive CD10 - Positive CD20","Positive CD15 - Positive CD30"],"a":2,"k":"Positive CD5 - Positive CD23"},{"n":21,"g":"Haematology","t":"Chronic leukemia","l":"W2 · L4 LECTURE","s":"P1 Final · Q52","r":"","q":"A 36-year-old male with Chronic Myeloid Leukemia (CML) develops blast phase with an emergent BCR-ABL1 T315I mutation resistant to firstand second-generation TKIs. After achieving secondary remission with salvage chemotherapy, what is the definitive curative treatment strategy?","o":["Autologous stem cell transplant alone","Hydroxyurea maintenance indefinitely","Allogenic stem cell transplant then continue TKI","Splenectomy followed by interferon-alpha","Supportive transfusions only"],"a":2,"k":"Allogenic stem cell transplant then continue TKI"},{"n":22,"g":"Haematology","t":"Chronic leukemia","l":"W2 · L4 LECTURE","s":"P1 Final · Q56","r":"","q":"A 70-year-old male presents with lethargy and cervical lymphadenopathy. CBC shows absolute lymphocytosis (WBC 65,000/µL, 85% mature lymphocytes), normocytic anemia (Hb 9.6 g/dL), and normal platelets. What is the clinical staging and management category according to Rai criteria?","o":["CLL (stage 0 - observation only)","CLL (stage I - localized radiotherapy)","CLL (stage III + initial therapy)","CLL (stage IV - hospice care)","Monoclonal B-cell lymphocytosis"],"a":2,"k":"CLL (stage III + initial therapy)"},{"n":23,"g":"Haematology","t":"Chronic leukemia","l":"W2 · L4 LECTURE","s":"P1 Final · Q60","r":"","q":"A patient with Chronic Myeloid Leukemia (CML) on imatinib develops worsening fatigue and progressive splenomegaly. Peripheral blood shows 14% myeloblasts, 22% basophils, and persistent thrombocytopenia unresponsive to therapy. Which phase of CML is this?","o":["CML (chronic phase)","CML (accelerated phase)","CML (blast crisis)","Molecular remission","Complete hematologic response"],"a":1,"k":"CML (accelerated phase)"},{"n":24,"g":"Haematology","t":"Chronic leukemia","l":"W2 · L4 LECTURE","s":"Midterm I · Q2","r":"","q":"The first line of treatment of CML (chronic phase) is:","o":["Imatinib","Corticosteroids","Rituximab","ATRA (cotinate noit)","Chemotherapy (7+3) followed by Allogenic stem cell transplantation"],"a":0,"k":"Imatinib"},{"n":25,"g":"Haematology","t":"Chronic leukemia","l":"W2 · L4 LECTURE","s":"Midterm II · Q17","r":"","q":"Male patient presented with left hypochondrial pain, early satiety, on examination showed marked splenomegaly. CBC showed: TLC: 100 x 10⁹/L, platelet: 560 x 10⁹/L, Hb: 10 gm/dl, blood film shows: myeloid progenitor cells, the most proba   const all=E("button","chip"+(F.g?"":" on"),"All");all.onclick=()=>{F.g="";F.t="";topics();I=0;go()};g.append(all);
  GR.forEach(n=>{const b=E("button","chip"+(F.g===n?" on":""));const d=E("span","dot");d.style.background=COL[n];b.append(d,n);
    b.onclick=()=>{F.g=n;F.t="";topics();I=0;go()};g.append(b)});
  const ans=L.filter(d=>S.a[d.n]!=null).length,cor=L.filter(d=>S.a[d.n]!=null&&ok(d)).length;
  $("#stat").textContent=L.length+" shown, "+ans+" answered"+((S.mode==="study"||S.fin)&&ans?", "+cor+" correct":"");
  $("#pb").style.width=(L.length?ans/L.length*100:0)+"%";
  $("#fin").style.display=S.mode==="exam"&&!S.fin?"":"none";
  const gr=$("#grid");gr.textContent="";
  L.forEach((d,j)=>{
    let c="";if(S.a[d.n]!=null)c=(S.mode==="study"||S.fin)&&d.a>=0?(ok(d)?"ok":"bad"):"done";
    const b=E("button",c+(j===I?" cur":"")+(S.bm[d.n]?" bm":""),d.n);b.title="Question "+d.n;b.onclick=()=>{I=j;go(true)};gr.append(b)});
}
function card(){
  const q=$("#qc");q.textContent="";
  if(!L.length){q.append(E("div","empty","No questions match this filter."));return}
  const d=L[I],c=E("div","card glass");
  const m=E("div","meta");
  const dt=E("span","dot");dt.style.background=COL[d.g];
  m.append(dt,E("span","tag","#"+d.n),E("span","",d.g+" / "+d.t+(d.l?" ("+d.l+")":"")),E("span","",d.s));
  if(d.r)m.append(E("span","rep","↻ "+d.r));
  const bm=E("button","bmb"+(S.bm[d.n]?" on":""),S.bm[d.n]?"★":"☆");bm.title="Bookmark (B)";bm.setAttribute("aria-label","Bookmark");
  bm.onclick=()=>{S.bm[d.n]?delete S.bm[d.n]:S.bm[d.n]=1;save();go(true)};m.append(bm);
  c.append(m,E("p","q",d.q));
  const sh=shown(d),lock=S.mode==="study"&&S.a[d.n]!=null||S.fin;
  const o=E("div","opts");
  d.o.forEach((t,j)=>{
    const b=E("button","o");b.append(E("b","","ABCDE"[j]),E("span","",t));
    if(S.a[d.n]===j)b.classList.add("sel");
    if(sh||S.rv[d.n]){if(j===d.a)b.classList.add("ok");else if(S.a[d.n]===j)b.classList.add("bad");b.classList.remove("sel")}
    b.disabled=lock||!!S.rv[d.n];
    b.onclick=()=>{S.a[d.n]=j;save();go(true)};o.append(b)});
  c.append(o);
  if(sh||S.rv[d.n]){const a=E("div","ans");const s=E("strong","","Answer: "+(d.a>=0?"ABCDE"[d.a]+"  ":""));a.append(s,document.createTextNode(d.k));c.append(a)}
  const n=E("div","nav");
  const pv=E("button","btn","Previous");pv.disabled=I===0;pv.onclick=()=>{I--;go(true)};
  const nx=E("button","btn p","Next");nx.disabled=I>=L.length-1;nx.onclick=()=>{I++;go(true)};
  n.append(pv,E("span","sp",(I+1)+" of "+L.length),nx);
  if(S.mode==="study"&&!sh){const r=E("button","btn",d.a<0?"Show answer":"Skip and show answer");r.onclick=()=>{S.rv[d.n]=1;save();go(true)};n.insertBefore(r,nx)}
  if(S.mode==="study"&&S.a[d.n]!=null){const r=E("button","btn","Try again");r.onclick=()=>{delete S.a[d.n];delete S.rv[d.n];save();go(true)};n.insertBefore(r,nx)}
  c.append(n);q.append(c);
}
function banner(){
  const b=$("#bn");b.textContent="";
  if(!(S.mode==="exam"&&S.fin))return;
  const sc=L.filter(d=>d.a>=0&&ok(d)).length,t=L.filter(d=>d.a>=0).length;
  const x=E("div","banner glass");
  x.append(E("strong","",sc+" / "+t+" ("+Math.round(sc/Math.max(t,1)*100)+"%)"),E("span","","Exam finished. Green and red show your results."));
  const r=E("button","btn","Review wrong answers");r.onclick=()=>{F.x="bad";$("#flag").value="bad";I=0;go()};
  const a=E("button","btn p","Retake");a.onclick=()=>{L.forEach(d=>{delete S.a[d.n];delete S.rv[d.n]});S.fin=false;F.x="";$("#flag").value="";save();go()};
  x.append(r,a);b.append(x);
}
function go(keep){if(!keep)filt();side();banner();card();$("#main").scrollTop=0;
  const c=$("#grid .cur");if(c&&c.scrollIntoView)c.scrollIntoView({block:"nearest"})}
$("#mode").onclick=e=>{const m=e.target.dataset&&e.target.dataset.m;if(!m)return;S.mode=m;S.fin=false;save();go()};
$("#topic").onchange=e=>{F.t=e.target.value;I=0;go()};
$("#flag").onchange=e=>{F.x=e.target.value;I=0;go()};
$("#fin").onclick=()=>{S.fin=true;save();go(true)};
$("#rst").onclick=()=>{if(confirm("Clear all answers and bookmarks?")){S.a={};S.bm={};S.rv={};S.fin=false;save();go()}};
function theme(){const r=document.documentElement;S.theme?r.setAttribute("data-theme",S.theme):r.removeAttribute("data-theme")}
$("#thm").onclick=()=>{const dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;S.theme=dark?"light":"dark";save();theme()};
const app=$("#app");$("#menu").onclick=()=>app.classList.add("open");$("#scrim").onclick=()=>app.classList.remove("open");
$("#grid").addEventListener("click",()=>app.classList.remove("open"));
document.addEventListener("keydown",e=>{
  if(/SELECT|INPUT/.test(e.target.tagName)||e.metaKey||e.ctrlKey)return;
  const d=L[I];if(!d)return;const k=e.key.toLowerCase();
  if(k==="arrowright"&&I<L.length-1){I++;go(true)}
  else if(k==="arrowleft"&&I>0){I--;go(true)}
  else if(k==="b"){S.bm[d.n]?delete S.bm[d.n]:S.bm[d.n]=1;save();go(true)}
  else{const j="abcde".indexOf(k)>=0?"abcde".indexOf(k):"12345".indexOf(k);
    if(j>=0&&j<d.o.length&&!(S.mode==="study"&&S.a[d.n]!=null)&&!S.fin&&!S.rv[d.n]){S.a[d.n]=j;save();go(true)}}
});
theme();topics();go();
</script>
</body>
</html>
